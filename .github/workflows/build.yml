name: Compilar y probar TeslaMate con Grafana

on:
  workflow_dispatch:
    inputs:
      teslamate_version:
        description: Versión que aparece al pie de tu TeslaMate, sin la v inicial
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Compilar imagen Linux x86-64
        env:
          TESLAMATE_VERSION: ${{ inputs.teslamate_version }}
        run: |
          [[ "$TESLAMATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker build --build-arg "TESLAMATE_VERSION=$TESLAMATE_VERSION" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t teslamate-grafana:prueba .
      - name: Probar los dos procesos con 512 MiB y 0,2 vCPU
        run: bash smoke-test.sh
      - name: Guardar imagen en un borrador de Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker save --output teslamate-grafana.tar teslamate-grafana:prueba
          zip -q teslamate-grafana-docker.zip teslamate-grafana.tar
          tag="imagen-prueba-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT"
          url=$(gh release create "$tag" teslamate-grafana-docker.zip \
            --draft --target "$GITHUB_SHA" --title "Imagen TeslaMate y Grafana: $tag" \
            --notes 'Descarga el ZIP, extrae el archivo TAR e impórtalo en Northflank.' \
            --repo "$GITHUB_REPOSITORY")
          printf 'Imagen probada lista para descargar\n\n[Abre el borrador y descarga teslamate-grafana-docker.zip](%s)\n' \
            "$url" >> "$GITHUB_STEP_SUMMARY"
